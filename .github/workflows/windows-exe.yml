name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install CPU inference packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install chatterbox-tts pyinstaller
      - name: Run logic tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows EXE folder
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name KoreanAITTSStudioNeural --collect-all chatterbox --collect-all torch --collect-all torchaudio neural_app.py
          if (!(Test-Path 'dist/KoreanAITTSStudioNeural/KoreanAITTSStudioNeural.exe')) { throw 'EXE not generated' }
      - name: Upload portable EXE package
        uses: actions/upload-artifact@v4
        with:
          name: KoreanAITTSStudioNeural_Windows_Portable
          path: dist/KoreanAITTSStudioNeural/
          if-no-files-found: error
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows setup EXE
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer\KoreanAITTSStudioNeural.iss'
          if (!(Test-Path 'dist_installer/KoreanAITTSStudioNeural_Setup.exe')) { throw 'Installer not generated' }
      - name: Upload setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: KoreanAITTSStudioNeural_Windows_Setup
          path: dist_installer/KoreanAITTSStudioNeural_Setup.exe
          if-no-files-found: error
